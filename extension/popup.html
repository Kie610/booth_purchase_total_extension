<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOTHお買いものレポート</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>BOOTHお買いものレポート</h1>

  <div id="runningBox" class="running" hidden>
    <div class="running-text" id="runningText">集計中...</div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div id="summaryBox" class="summary" hidden>
    <div class="summary-label" id="summaryLabel">前回の集計結果</div>
    <div class="summary-value" id="totalAmount"></div>
    <div class="summary-sub" id="totalCount"></div>
    <!-- 今年の合計。この項目より前に保存された要約には年の情報が無いので、
         そのときはこの行ごと出さない(0円と書くと買っていないように見える) -->
    <div class="summary-year" id="summaryYearBox" hidden>
      <span class="summary-year-label" id="summaryYearLabel"></span>
      <span class="summary-year-value" id="summaryYearTotal"></span>
      <span class="summary-year-count" id="summaryYearCount"></span>
    </div>
    <div class="summary-sub" id="updatedAt"></div>
  </div>

  <div id="emptyBox" class="empty" hidden>
    まだ集計していません。集計ページを開いて「集計を実行」を押してください。
  </div>

  <button id="openBtn">集計ページを開く</button>

  <p class="hint">
    集計は専用ページ上で実行されるため、このポップアップを閉じても処理は続きます
    (集計ページのタブは開いたままにしてください)。
  </p>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
