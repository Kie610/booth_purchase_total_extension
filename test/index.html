<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'">
<title>dashboard test harness</title>
</head>
<!-- dashboard.js の init() は保存データを非同期で state へ読み込む。
     テストは state を直接差し替えるので、走らせると競合する -->
<body data-no-auto-init>
<!-- エラー拾いは harness.js に置く。index.html は拡張と同じ script-src 'self' を
     宣言しているため、インラインの <script> は実行されずに黙って捨てられる -->
<script src="harness.js"></script>
<pre id="out">running...</pre>

<!-- dashboard.html と同じ要素構成 -->
<button id="menuBtn" aria-expanded="false"></button>
<span id="viewTitle"></span>
<div id="navOverlay" hidden></div>
<nav id="navDrawer" hidden>
<a class="nav-link" href="#/report" data-view="report">お買いものレポート</a>
<a class="nav-link" href="#/ranking" data-view="ranking">推し作者ランキング</a>
<a class="nav-link" href="#/trends" data-view="trends">支出推移・前年比較</a>
<a class="nav-link" href="#/summary" data-view="summary">今年のまとめ</a>
<a class="nav-link" href="#/export" data-view="export">データ出力</a>
<a class="nav-link" href="#/backup" data-view="backup">データの引っ越し</a>
</nav>

<div id="pendingBanner" hidden><span id="pendingBannerText"></span><a href="#/report">お買いものレポートで収集する</a></div>

<div class="view" id="view-report"></div>
<div class="view" id="view-trends" hidden>
  <div id="trendsEmpty"></div>
  <div id="trendsArea" hidden>
    <select id="trendYear"></select>
    <select id="trendBaseYear"></select>
    <div id="trendSummary" class="stat-grid"></div>
    <span id="trendCurrentYearLabel"></span>
    <span id="trendPreviousYearLabel"></span>
    <div id="monthlyTrendChart" class="trend-bars"></div>
    <svg id="cumulativeTrendChart" class="cumulative-chart" viewBox="0 0 720 250"></svg>
    <select id="heatmapFrom"></select>
    <select id="heatmapTo"></select>
    <button id="heatmapAllBtn"></button>
    <span id="heatmapStats"></span>
    <div id="heatmapEmpty" hidden></div>
    <div id="heatmapGrid"></div>
    <div id="heatmapSkipped" hidden></div>
    <table class="period-table"><tbody id="trendPeriodTableBody"></tbody></table>
  </div>
</div>
<div class="view" id="view-summary" hidden>
  <select id="summaryYear"></select>
  <div id="summaryEmpty"></div>
  <div id="summaryArea" hidden>
    <div id="summaryCards" class="stat-grid"></div>
    <div id="summaryNewShopWarn" hidden></div>
    <table><tbody id="summaryTopShopsBody"></tbody></table>
  </div>
</div>
<div class="view" id="view-ranking" hidden>
  <div id="rankingEmpty"></div>
  <div id="rankingArea" hidden>
    <div id="rankingStats"></div>
    <div id="rankingUnknown" hidden></div>
    <div id="rankingSortToggle">
      <button class="segmented-btn" data-sort="amount" aria-pressed="true">金額編</button>
      <button class="segmented-btn" data-sort="count" aria-pressed="false">購入数編</button>
    </div>
    <label><input type="checkbox" id="rankingHideNumbers">金額や購入数を含めない</label>
    <table>
      <thead><tr><th data-sort="count">購入商品数</th><th data-sort="amount">合計金額</th></tr></thead>
      <tbody id="rankingTableBody"></tbody>
    </table>
  </div>
</div>
<div class="view" id="view-export" hidden>
  <div id="exportEmpty"></div>
  <div id="exportArea" hidden>
    <div id="exportStats"></div>
    <div id="exportGap" hidden></div>
    <button id="exportOrdersBtn"></button>
    <button id="exportItemsBtn"></button>
    <table><tbody id="exportPreviewBody"></tbody></table>
  </div>
</div>
<div class="view" id="view-backup" hidden>
  <div id="backupStats"></div>
  <div id="backupCoverage" hidden></div>
  <button id="backupSaveBtn"></button>
  <input type="file" id="restoreFile">
  <div id="restoreStatus"></div>
</div>

<div id="progress" hidden>
  <span id="progressText"></span>
  <button id="abortBtn"></button>
  <div><div id="progressFill"></div></div>
</div>
<div id="noticeBox" hidden></div>
<div id="errorBox" hidden></div>

<div id="summarySection" hidden>
  <span id="totalGift"></span><span id="totalAmount"></span><span id="totalCount"></span>
  <span id="pendingCount"></span><span id="skippedCount"></span>
</div>

<button id="runAllBtn"></button>
<input type="checkbox" id="forceRefreshAll">

<details class="accordion">
  <summary><h2>キャッシュ削除</h2></summary>
  <button id="clearIndexBtn"></button><span id="clearIndexStatus"></span>
  <button id="clearAmountsBtn"></button><span id="clearAmountsStatus"></span>
</details>

<button id="fetchIndexBtn"></button>
<input type="checkbox" id="forceRefreshIndex">
<div id="indexStatus"></div>
<div id="indexCoverage" hidden></div>

<div id="monthEmpty"></div>
<div id="monthArea" hidden>
  <div id="rangeArea">
    <select id="rangeFrom"></select>
    <select id="rangeTo"></select>
    <button id="selectPendingBtn"></button>
    <button id="collectRangeBtn"></button>
    <span id="plannedCount"></span>
    <input type="checkbox" id="forceRefreshRange">
  </div>
  <table><tbody id="monthTableBody"></tbody></table>
  <p id="unknownArea" hidden><span id="unknownCount"></span></p>
  <p id="outdatedArea" hidden><span id="outdatedCount"></span></p>
</div>

<div id="breakdownSection" hidden>
  <table><tbody id="periodTableBody"></tbody></table>
  <details class="accordion">
    <summary><h2>注文ごとの内訳<span id="orderRowCount"></span></h2></summary>
    <div class="table-scroll"><table><tbody id="orderTableBody"></tbody></table></div>
  </details>
</div>

<div>
  <span id="footTotal"></span><span id="footTotalCount"></span><span id="footTotalGift"></span>
  <span id="footYearLabel"></span><span id="footYearTotal"></span><span id="footYearCount"></span><span id="footYearGift"></span>
  <button id="shareBtn" class="share-btn" disabled>𝕏で共有</button>
</div>

<div id="shareOverlay" hidden></div>
<div id="sharePanel" hidden>
  <button id="shareCloseBtn"></button>
  <div id="shareRatioToggle">
    <button class="segmented-btn" data-ratio="16:9" aria-pressed="true">16:9</button>
    <button class="segmented-btn" data-ratio="1:1" aria-pressed="false">1:1</button>
    <button class="segmented-btn" data-ratio="4:3" aria-pressed="false">4:3</button>
    <button class="segmented-btn" data-ratio="3:4" aria-pressed="false">3:4</button>
  </div>
  <div id="shareDropZone"></div>
  <div id="shareTemplates"></div>
  <canvas id="shareCanvas" width="1200" height="675"></canvas>
  <input type="file" id="shareBgFile">
  <button id="shareBgClearBtn" hidden></button>
  <span id="shareBgName"></span>
  <textarea id="shareText"></textarea>
  <button id="shareCopyBtn"></button>
  <button id="shareSaveBtn"></button>
  <button id="shareOpenBtn"></button>
  <span id="shareCardStatus"></span>
</div>

<script src="stub.js"></script>
<script src="../extension/common.js"></script>
<script src="../extension/purchase-examples.js"></script>
<script src="../extension/csv.js"></script>
<script src="../extension/backup.js"></script>
<script src="../extension/share.js"></script>
<script src="../extension/dashboard-parse.js"></script>
<script src="../extension/dashboard-view.js"></script>
<script src="../extension/dashboard.js"></script>

<script src="loaded.js"></script>

<script src="cases.js"></script>
</body>
</html>
